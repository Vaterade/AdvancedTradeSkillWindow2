name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 luajit
      # Vendored Ace2 libraries contain valid Lua 5.0 that newer compilers reject.
      - name: Check Lua syntax
        run: find . -name '*.lua' -not -path '*/Libs/*' -print0 | xargs -0 -n1 luac5.4 -p
      # tools/test.lua prints PASS or FAIL per test but exits 0 when a test fails,
      # so the exit code alone isn't enough.
      - name: Run offline tests
        run: |
          run_test() {
            echo "== $*"
            code=0
            output=$("$@" 2>&1) || code=$?
            printf '%s\n' "$output"
            if [ "$code" -ne 0 ] || grep -q '^FAIL' <<<"$output" || ! grep -q '^PASS' <<<"$output"; then
              echo "::error::Offline tests failed: $*"
              exit 1
            fi
          }
          run_test luajit tools/test.lua .
          run_test luajit tools/test.lua . pfui
          run_test luajit tools/test.lua . pfui disabled
          run_test env NOCAPI=1 luajit tools/test.lua .
